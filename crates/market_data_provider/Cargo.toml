[package]
name = "market_data_provider"
description = "Connect to exchanges, get market data, publish it to strategies over shared memory; also the library strategies use to subscribe and read"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
aes.workspace = true
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
bcast.workspace = true
cbc.workspace = true
chrono.workspace = true
clap.workspace = true
futures.workspace = true
hex.workspace = true
memmap2.workspace = true
rand.workspace = true
reqwest.workspace = true
rkyv.workspace = true
rust_decimal.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
snow.workspace = true
strum.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[features]
# Exposes `MarketDataWriter` to the benches; never enable it in strategies.
bench = []

[dev-dependencies]
criterion.workspace = true
tempfile.workspace = true
# Paused tokio time, so heartbeat tests take no wall time.
tokio = { workspace = true, features = ["test-util"] }
ureq.workspace = true

[[bench]]
name = "latency"
harness = false
required-features = ["bench"]

[lints]
workspace = true
