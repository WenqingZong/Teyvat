# Copied to /etc/market_data_provider/market_data_provider.toml (chmod 600, it holds the Bark credentials) by
# `deploy/market_data_provider.sh install`; fill in the placeholders there. For a local run, copy it anywhere
# and start `market_data_provider --config <file>`.
port = 6666                                          # strategies assume 6666 (DEFAULT_PROVIDER_ADDRESS)
# false serves live data; true serves the venues' demo data. Strategies must ask for the same.
demo = false

[phanes]
url = "<Phanes URL, as Cloudflare exposes it>"
gnosis_private_key_file = "/etc/market_data_provider/gnosis_client.key"   # generated by the install, chmod 600
gnosis_public_key = "<base64 Gnosis public key of Phanes: /etc/phanes/gnosis.pub on the Phanes host>"

# Required by release builds; debug builds log alerts instead.
[bark]
device_key = "<fill me>"
encryption_key = "<fill me: 32 characters, set AES-256-CBC in the Bark app>"
