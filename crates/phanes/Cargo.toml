[package]
name = "phanes"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.9.3"
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
cbc = { version = "0.2.1", features = ["alloc", "block-padding"] }
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
hex = "0.4.3"
jiff = "0.2.38"
log = "0.4.34"
postcard = { version = "1.1.3", features = ["use-std"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", features = ["form", "json"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
snow = "0.10.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1.8"
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["process"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots", "url"] }
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

# Osaka-side simulator; its client and sampler modules carry their own tests.
[[example]]
name = "celestia"
test = true
