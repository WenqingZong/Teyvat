[package]
name = "layline"
description = "Code shared by every Teyvat crate: domain types, wire protocols, shared memory and service plumbing"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
aes.workspace = true
anyhow.workspace = true
base64.workspace = true
bcast.workspace = true
cbc.workspace = true
chrono.workspace = true
futures.workspace = true
hex.workspace = true
memmap2.workspace = true
postcard.workspace = true
rand.workspace = true
reqwest.workspace = true
rkyv.workspace = true
rust_decimal.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
snow.workspace = true
strum.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["signal"] }
tokio-tungstenite.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
layline-testing.workspace = true
tempfile.workspace = true

[lints]
workspace = true

# `/proc` parsing and netlink `sock_diag` are Linux-only: `procfs` refuses every other target in
# its build script, and the netlink crates need Linux `libc` symbols.
[target.'cfg(target_os = "linux")'.dependencies]
netlink-packet-core.workspace = true
netlink-packet-sock-diag.workspace = true
netlink-sys.workspace = true
procfs.workspace = true
