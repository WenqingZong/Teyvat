# Copied to /etc/market_data_provider/market_data_provider.toml (chmod 600, it holds the Gnosis private key and the
# Bark credentials) by `deploy/market_data_provider/market_data_provider.sh install`, which fills in the private key;
# fill in the other placeholders there. For a local run, copy it anywhere and start `market_data_provider --config <file>`.
port = 6666                                          # strategies name 127.0.0.1:6666 as provider_address
# false serves live data; true serves the venues' demo data. Strategies must ask for the same.
demo = true

[phanes]
url = "<Phanes URL, as Cloudflare exposes it>"
gnosis_private_key = "<Gnosis client private key, generated by the install>"   # base64
gnosis_public_key = "<base64 Gnosis public key of Phanes: /etc/phanes/gnosis.pub on the Phanes host>"

# Required by release builds; debug builds log alerts instead.
[bark]
device_key = "<fill me>"
encryption_key = "<fill me: 32 characters, set AES-256-CBC in the Bark app>"
