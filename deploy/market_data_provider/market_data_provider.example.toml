# Copied to /etc/market_data_provider/market_data_provider.toml (chmod 600, it holds the Gnosis private key and the
# Bark credentials) by `deploy/market_data_provider/market_data_provider.sh install`, which fills in the private key;
# fill in the other placeholders there. For a local run, copy it anywhere and start `market_data_provider --config <file>`.
port = 6666                                          # strategies name 127.0.0.1:6666 as provider_address
# false serves live data; true serves the venues' demo data. Strategies must ask for the same.
demo = true
process_metrics_interval_seconds = 10                # how often to log the process's CPU, memory, threads and TCP traffic

# This provider as a client of Phanes. Its own public key is not needed here: Noise derives it from
# the private key, and so does the install, which prints it for Phanes' [clients.<name>] table.
[gnosis_client]
url = "<Phanes URL, as Cloudflare exposes it>"
client_gnosis_private_key = "<Gnosis client private key, generated by the install>"   # base64
phanes_gnosis_public_key = "<base64 Gnosis public key of Phanes, printed by deploy/phanes/phanes.sh install>"

# Where the process metrics go, through Phanes Celestia; url is the same as [gnosis_client] url. The
# private key is this machine's: the install generates it, and every strategy's install copies this
# table's settings into its strategy.toml.
[celestia_client]
url = "<Phanes URL, as Cloudflare exposes it>"
client_celestia_private_key = "<Celestia client private key of this machine, generated by the install>"   # base64
phanes_celestia_public_key = "<base64 Celestia public key of Phanes, printed by deploy/phanes/phanes.sh install>"

# Required by release builds; debug builds log alerts instead.
[bark]
device_key = "<fill me>"
encryption_key = "<fill me: 32 characters, set AES-256-CBC in the Bark app>"
