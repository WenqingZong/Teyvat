# The config every strategy reads: who it is, where the provider is, which environment, which topics.
# Copied to /etc/dummy_strategy/strategy.toml (chmod 600, like every service config) by
# `deploy/dummy_strategy/dummy_strategy.sh install`. For a local run, copy it anywhere, chmod 600 it
# and start `dummy_strategy --config <file>`.
strategy_name = "dummy_strategy"
provider_address = "127.0.0.1:6666"                  # 127.0.0.1:<port> of market_data_provider.toml
demo = true                                          # trade on the venues' demo accounts; must equal the provider's demo
process_metrics_interval_seconds = 10                # how often to log the process's CPU, memory, threads and TCP traffic

# Where the process metrics go. The install copies this whole table from the market data provider's
# config, which holds this machine's Celestia key, on every install; leave the placeholders.
[celestia_client]
url = "<copied from /etc/market_data_provider/market_data_provider.toml by the install>"
client_celestia_private_key = "<copied from /etc/market_data_provider/market_data_provider.toml by the install>"
phanes_celestia_public_key = "<copied from /etc/market_data_provider/market_data_provider.toml by the install>"

# Exchange, then instrument (BASE-QUOTE-SPOT or BASE-QUOTE-PERP), then market data types, as in the
# provider's HTTP API. The provider fetches each instrument's rules from the exchange on demand and
# refreshes them on the first request after 24 hours; a topic whose rules are unavailable stops the provider and names the instrument.
# A stock's spot pair is its bStock: AAPL-USDT-SPOT is AAPLB/USDT on the exchange, while
# AAPL-USDT-PERP is AAPLUSDT. Binance demo lists all seven bStocks but not AAPL/MSFT perpetuals, so
# those two perpetuals can only be added when demo = false.
# ORDER_BOOK is the top ten levels of each side; Binance spot uses the SBE diff stream with a REST
# snapshot, so the provider needs the SBE key and the depth snapshot endpoint.
[topics.Binance]
AAPL-USDT-PERP = ["AGGREGATE_TRADE", "BBO", "ORDER_BOOK", "TRADE"]
AAPL-USDT-SPOT = ["AGGREGATE_TRADE", "BBO", "ORDER_BOOK", "TRADE"]
AMZN-USDT-PERP = ["AGGREGATE_TRADE", "BBO", "ORDER_BOOK", "TRADE"]
AMZN-USDT-SPOT = ["AGGREGATE_TRADE", "BBO", "ORDER_BOOK", "TRADE"]
BTC-USDT-PERP = ["AGGREGATE_TRADE", "BBO", "ORDER_BOOK", "TRADE"]
BTC-USDT-SPOT = ["AGGREGATE_TRADE", "BBO", "ORDER_BOOK", "TRADE"]
ETH-USDT-PERP = ["AGGREGATE_TRADE", "BBO", "ORDER_BOOK", "TRADE"]
ETH-USDT-SPOT = ["AGGREGATE_TRADE", "BBO", "ORDER_BOOK", "TRADE"]
GOOGL-USDT-PERP = ["AGGREGATE_TRADE", "BBO", "ORDER_BOOK", "TRADE"]
GOOGL-USDT-SPOT = ["AGGREGATE_TRADE", "BBO", "ORDER_BOOK", "TRADE"]
META-USDT-PERP = ["AGGREGATE_TRADE", "BBO", "ORDER_BOOK", "TRADE"]
META-USDT-SPOT = ["AGGREGATE_TRADE", "BBO", "ORDER_BOOK", "TRADE"]
MSFT-USDT-PERP = ["AGGREGATE_TRADE", "BBO", "ORDER_BOOK", "TRADE"]
MSFT-USDT-SPOT = ["AGGREGATE_TRADE", "BBO", "ORDER_BOOK", "TRADE"]
NVDA-USDT-PERP = ["AGGREGATE_TRADE", "BBO", "ORDER_BOOK", "TRADE"]
NVDA-USDT-SPOT = ["AGGREGATE_TRADE", "BBO", "ORDER_BOOK", "TRADE"]
TSLA-USDT-PERP = ["AGGREGATE_TRADE", "BBO", "ORDER_BOOK", "TRADE"]
