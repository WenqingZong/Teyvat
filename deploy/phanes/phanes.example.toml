# Copied to /etc/phanes/phanes.toml (chmod 600: it holds the private keys, the gnoses and the Bark
# credentials) by `deploy/phanes/phanes.sh install`, which fills in the private keys; fill in the rest.
listen_address = "127.0.0.1:8888"                    # cloudflared ingress; release builds require loopback
gnosis_private_key = "<Gnosis private key, generated by the install>"       # base64, like every key here
celestia_private_key = "<Celestia private key, generated by the install>"
max_clock_skew_seconds = 60

# One table per client. Every client may call every service: Phanes knows it by the public key it
# signs that service's handshake with, and in release builds its address must be its own.
[clients.Osaka]
ipv4 = "<Osaka IPv4>"                              # required: the address Cloudflare reports in CF-Connecting-IP
ipv6 = "<Osaka IPv6>"                              # optional
client_gnosis_service_public_key = "<base64 Gnosis public key of the client>"
client_celestia_service_public_key = "<base64 Celestia public key of the client>"
allowed_gnosis_ids = ["binance_demo", "binance_sbe_demo"]   # may be empty

# One table per gnosis Phanes holds, named by its GnosisId, with the fields of its key type.
[gnoses.binance_demo]
api_key = "<API key>"
secret_key = "<API secret>"

[gnoses.binance_sbe_demo]
api_key = "<API key>"

# Required by release builds; debug builds log notifications instead.
[bark]
device_key = "<fill me>"
encryption_key = "<fill me: 32 characters, set AES-256-CBC in the Bark app>"
