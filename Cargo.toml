[workspace]
members = ["crates/*"]
resolver = "3"

# Every binary of the system, production services and test tools alike, is defined here, so one
# command builds them all: `cargo build --release --bins --examples`.
[package]
name = "teyvat"
description = "Every binary of the Teyvat trading system: the production services and their test tools"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish = false

[dependencies]
dummy_strategy.workspace = true
layline.workspace = true
market_data_provider.workspace = true
phanes.workspace = true

anyhow.workspace = true
clap.workspace = true
secrecy.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-appender.workspace = true

[dev-dependencies]
reqwest.workspace = true
serde_json.workspace = true
url.workspace = true

[[bin]]
name = "dummy_strategy"
path = "src/bin/dummy_strategy.rs"

[[bin]]
name = "market_data_provider"
path = "src/bin/market_data_provider.rs"

[[bin]]
name = "phanes"
path = "src/bin/phanes.rs"

# Fetches one API key from Gnosis, as Osaka does.
[[example]]
name = "fetch"
path = "examples/fetch.rs"

# Sends one Bark push with the credentials of a phanes.toml.
[[example]]
name = "bark_push"
path = "examples/bark_push.rs"

# Celestia smoke test: monitors itself and reports to Phanes, as the services do.
[[example]]
name = "celestia"
path = "examples/celestia.rs"

[lints]
workspace = true

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Wenqing Zong"]

[workspace.dependencies]
dummy_strategy = { path = "crates/dummy_strategy" }
layline = { path = "crates/layline" }
market_data_provider = { path = "crates/market_data_provider" }
phanes = { path = "crates/phanes" }

aes = "0.9.3"
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
cbc = { version = "0.2.1", features = ["alloc", "block-padding"] }
chrono = "0.4.42"
clap = { version = "4.6.7", features = ["derive"] }
criterion = { version = "0.8.2", features = ["html_reports"] }
futures = "0.3.32"
hex = "0.4.3"
memmap2 = "0.9.9"
netlink-packet-core = "0.9.0"
netlink-packet-sock-diag = "0.5.0"
netlink-sys = "0.9.0"
postcard = { version = "1.1.3", features = ["use-std"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", features = ["form", "json"] }
rkyv = "0.8.12"
rust_decimal = { version = "1.43.0", features = ["macros"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
snow = "0.10.0"
strum = { version = "0.28.0", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots", "url"] }
toml = "1.1.8"
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["chrono", "env-filter"] }
ureq = { version = "3.4.2", default-features = false, features = ["json"] }
url = { version = "2.5.8", features = ["serde"] }

[workspace.lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
unwrap_used = "deny"
