[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Wenqing Zong"]

[workspace.dependencies]
market_data_provider = { path = "crates/market_data_provider" }
aes = "0.9.3"
anyhow = "1.0.100"
axum = "0.8.9"
base64 = "0.23.1"
cbc = { version = "0.2.1", features = ["alloc", "block-padding"] }
chrono = "0.4.42"
clap = { version = "4.6.7", features = ["derive"] }
criterion = { version = "0.8.2", features = ["html_reports"] }
bcast = { version = "0.0.31", features = ["mmap"] }
futures = "0.3.32"
hex = "0.4.3"
memmap2 = "0.9.9"
rand = "0.10.3"
reqwest = { version = "0.13.5", features = ["form", "json"] }
rkyv = "0.8.12"
rust_decimal = { version = "1.43.0", features = ["macros"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
snow = "0.10.0"
strum = { version = "0.28.0", features = ["derive"] }
tempfile = "3"
thiserror = "2.0.21"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots", "url"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["chrono", "env-filter"] }
ureq = { version = "3.4.2", default-features = false, features = ["json"] }
url = { version = "2.5.8", features = ["serde"] }

[workspace.lints.clippy]
unwrap_used = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
